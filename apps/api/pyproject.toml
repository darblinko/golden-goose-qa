[project]
name = "goldengoose-api"
version = "0.1.0"
description = "FastAPI + LangGraph service"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gg-common",
    "gg-ingestion",
    "gg-retrieval",
    "gg-agents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "pyjwt[crypto]>=2.10",
    "langgraph-checkpoint-postgres>=3.1",
]

[tool.uv.sources]
gg-common = { workspace = true }
gg-ingestion = { workspace = true }
gg-retrieval = { workspace = true }
gg-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldengoose_api"]
