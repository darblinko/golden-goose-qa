[project]
name = "gg-agents"
version = "0.1.0"
description = "LangGraph graphs, nodes, prompts, tool registry"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gg-common",
    "gg-retrieval",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
]

[tool.uv.sources]
gg-common = { workspace = true }
gg-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_agents"]
