[project]
name = "gg-evals"
version = "0.1.0"
description = "Retrieval and answer quality evaluation harness with CI gates"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gg-agents",
    "gg-common",
    "gg-retrieval",
    "pydantic>=2.10",
]

[project.scripts]
gg-eval = "gg_evals.cli:main"

[tool.uv.sources]
gg-agents = { workspace = true }
gg-common = { workspace = true }
gg-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_evals"]
