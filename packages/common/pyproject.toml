[project]
name = "gg-common"
version = "0.1.0"
description = "Shared settings, models, provider adapters, object store, telemetry"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "boto3>=1.35",
    "neo4j>=5.26",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.scripts]
gg-backup = "gg_common.backup_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_common"]
