[project]
name = "gg-retrieval"
version = "0.1.0"
description = "Hybrid search, fusion, rerank, graph traversal tools, SQL tools"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gg-common",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "neo4j>=5.26",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "sqlglot>=25.0",
]

[tool.uv.sources]
gg-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gg_retrieval"]
